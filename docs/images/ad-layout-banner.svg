<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 928"
     width="1120" height="928" role="img"
     aria-label="Pearland411 banner page layout: Narrow form — two wide zones">
  <title>Pearland411 ad layout — Narrow form — two wide zones</title>
  <style>
    .zsize   { font-family: 'Poppins','Open Sans',system-ui,sans-serif; font-weight: 700; fill: #FFFFFF; }
    .zkey    { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #FFFFFF; opacity: .8; }
    .zkey-out{ font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #5A6472; }
    .wire    { font-family: 'Poppins','Open Sans',system-ui,sans-serif; font-weight: 600; fill: #20245B; opacity: .55; }
  </style>
  <defs>
    <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A3D59"/>
      <stop offset="1" stop-color="#4E1A2B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="928" fill="#FFFFFF"/>
  <rect x="28" y="28" width="1064" height="52" rx="6" fill="#20245B"/><rect x="48" y="46" width="128" height="16" rx="4" fill="#FFFFFF" opacity="0.85"/><rect x="1016" y="50" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/><rect x="928" y="50" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/><rect x="840" y="50" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/><rect x="752" y="50" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/><rect x="664" y="50" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/>
  <g>
    <rect x="28" y="96" width="1064" height="62" rx="6" fill="url(#zone)"/>
    <rect x="28" y="96" width="1064" height="62" rx="6" fill="url(#sheen)"/>
    <text x="560.0" y="117.25" text-anchor="middle"
          dominant-baseline="central" class="zsize" font-size="24">700x100</text>
    <text x="560.0" y="147.4" text-anchor="middle" dominant-baseline="central" class="zkey" font-size="13">top-banner-site-wide</text>
  </g>
  <rect x="28" y="192" width="1064" height="104" rx="8" fill="#9FC1E4" opacity="0.7"/><text x="52" y="236" class="wire" font-size="17">Page heading</text><rect x="52" y="254" width="420" height="6" rx="3" fill="#BFD4EA"/><rect x="52" y="266" width="252" height="6" rx="3" fill="#BFD4EA"/><rect x="220" y="322" width="681" height="326" rx="8" fill="#EDF3F9" stroke="#C7DBEF"/><text x="246" y="362" class="wire" font-size="16">Form</text><rect x="246" y="386" width="629" height="38" rx="6" fill="#FFFFFF" stroke="#C7DBEF"/><rect x="246" y="444" width="629" height="38" rx="6" fill="#FFFFFF" stroke="#C7DBEF"/><rect x="246" y="502" width="629" height="38" rx="6" fill="#FFFFFF" stroke="#C7DBEF"/><rect x="246" y="560" width="629" height="38" rx="6" fill="#FFFFFF" stroke="#C7DBEF"/><rect x="246" y="614" width="152" height="34" rx="17" fill="#79B82A"/>
  <g>
    <rect x="28" y="678" width="1064" height="62" rx="6" fill="url(#zone)"/>
    <rect x="28" y="678" width="1064" height="62" rx="6" fill="url(#sheen)"/>
    <text x="560.0" y="699.25" text-anchor="middle"
          dominant-baseline="central" class="zsize" font-size="24">900x100</text>
    <text x="560.0" y="729.4" text-anchor="middle" dominant-baseline="central" class="zkey" font-size="13">bottom-banner-site-wide</text>
  </g>
  
  <g>
    <rect x="28" y="766" width="1064" height="52" rx="6" fill="url(#zone)"/>
    <rect x="28" y="766" width="1064" height="52" rx="6" fill="url(#sheen)"/>
    <text x="560.0" y="792.0" text-anchor="middle"
          dominant-baseline="central" class="zsize" font-size="20">970x90</text>
    
  </g>
  <text x="1084" y="833" text-anchor="end" class="zkey-out" font-size="11">footer-banner</text><rect x="28" y="844" width="1064" height="56" rx="6" fill="#20245B"/><rect x="54" y="868" width="188" height="8" rx="4" fill="#FFFFFF" opacity="0.3"/><rect x="316" y="868" width="188" height="8" rx="4" fill="#FFFFFF" opacity="0.3"/><rect x="578" y="868" width="188" height="8" rx="4" fill="#FFFFFF" opacity="0.3"/><rect x="840" y="868" width="188" height="8" rx="4" fill="#FFFFFF" opacity="0.3"/>
</svg>
