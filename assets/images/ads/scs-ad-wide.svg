<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"
     role="img" aria-label="Space Center Systems — website design, hosting and local SEO">
  <title>Space Center Systems — websites, hosting and local SEO</title>
  <!-- 3:1, content inside the middle 70% vertically. See house-ad-wide.svg. -->
  <defs>
    <linearGradient id="swBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2430"/>
      <stop offset="0.62" stop-color="#2B3545"/>
      <stop offset="1" stop-color="#3A4759"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="url(#swBg)"/>
  <g opacity="0.16"><circle cx="820" cy="40" r="140" fill="#8CC63F"/></g>
  <g stroke="#8CC63F" stroke-width="1" opacity="0.13">
    <path d="M0 100h900M0 150h900M0 200h900"/>
  </g>

  <g transform="translate(120 150) scale(0.95)" fill="none" stroke="#8CC63F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-38" y="-30" width="76" height="52" rx="6"/>
    <path d="M-14 34h28M0 22v12"/>
    <path d="M-18-12l-8 8 8 8M18-12l8 8-8 8M6-16l-12 24" stroke-width="4"/>
  </g>

  <text x="192" y="118"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="14" font-weight="600" letter-spacing="2.6" fill="#8CC63F">SPACE CENTER SYSTEMS</text>
  <text x="192" y="162"
        font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.6" fill="#FFFFFF">Websites that bring customers</text>
  <text x="192" y="194"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="17" fill="#B9C3D2">Web design &#183; Hosting &#183; Local SEO</text>

  <g transform="translate(192 212)">
    <rect width="164" height="48" rx="24" fill="#8CC63F"/>
    <text x="82" y="31" text-anchor="middle"
          font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
          font-size="18" font-weight="700" fill="#16202C">Get a quote</text>
  </g>
