<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100"
     role="img" aria-label="Advertise your business on Pearland411">
  <title>Your ad could be here — advertise on Pearland411</title>
  <!--
    8:1. The zones using this shape are 700x100 (7:1) and 900x100 (9:1), so the
    artwork sits between them and everything important stays inside x 70..560,
    which survives the crop in both directions.
  -->
  <defs>
    <linearGradient id="hsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E8A28"/>
      <stop offset="0.58" stop-color="#6BA935"/>
      <stop offset="1" stop-color="#8CC63F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="100" fill="url(#hsBg)"/>
  <g opacity="0.10"><circle cx="726" cy="6" r="56" fill="#FFFFFF"/></g>

  <g transform="translate(44 50) scale(0.46)" opacity="0.95">
<path d="M0-40c-11 0-20 10-20 24 0 9-9 15-14 25-8 17 6 38 34 38s42-21 34-38c-5-10-14-16-14-25 0-14-9-24-20-24z" fill="#FFFFFF"/>
    <path d="M1-40c0-10 2-18 6-25" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M9-61c7-14 22-21 36-19 1 15-9 26-26 28-6 1-10-4-10-9z" fill="#DCEFC0"/>
  </g>

  <text x="76" y="43"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="2.1" fill="#DCEFC0">AD SPACE AVAILABLE</text>
  <text x="76" y="70"
        font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.3" fill="#FFFFFF">Your ad here — reach Pearland</text>

  <g transform="translate(590 30)">
    <rect width="156" height="40" rx="20" fill="#FFFFFF"/>
    <text x="78" y="26" text-anchor="middle"
          font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
          font-size="15" font-weight="700" fill="#4E8A28">Advertise here</text>
  </g>
</svg>
