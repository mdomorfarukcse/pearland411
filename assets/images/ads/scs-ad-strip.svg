<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100"
     role="img" aria-label="Space Center Systems — website design, hosting and local SEO">
  <title>Space Center Systems — websites, hosting and local SEO</title>
  <!--
    8:1. The zones using this shape are 700x100 (7:1) and 900x100 (9:1), so the
    artwork sits between them and everything important stays inside x 70..560,
    which survives the crop in both directions.
  -->
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2430"/>
      <stop offset="0.58" stop-color="#2B3545"/>
      <stop offset="1" stop-color="#3A4759"/>
    </linearGradient>
  </defs>

  <rect width="800" height="100" fill="url(#ssBg)"/>
  <g opacity="0.16"><circle cx="726" cy="6" r="56" fill="#8CC63F"/></g>

  <g transform="translate(44 50) scale(0.42)" fill="none" stroke="#8CC63F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<rect x="-38" y="-30" width="76" height="52" rx="6"/>
    <path d="M-14 34h28M0 22v12"/>
    <path d="M-18-12l-8 8 8 8M18-12l8 8-8 8M6-16l-12 24" stroke-width="4"/>
  </g>

  <text x="76" y="43"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="2.1" fill="#8CC63F">SPACE CENTER SYSTEMS</text>
  <text x="76" y="70"
        font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.3" fill="#FFFFFF">Websites that bring customers</text>

  <g transform="translate(590 30)">
    <rect width="140" height="40" rx="20" fill="#8CC63F"/>
    <text x="70" y="26" text-anchor="middle"
          font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
          font-size="15" font-weight="700" fill="#16202C">Get a quote</text>
  </g>
</svg>
