<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100"
     role="img" aria-label="Banner and ad design by Pearland411">
  <title>Need a banner designed? Pearland411 designs your ad</title>
  <!--
    8:1. The zones using this shape are 700x100 (7:1) and 900x100 (9:1), so the
    artwork sits between them and everything important stays inside x 70..560,
    which survives the crop in both directions.
  -->
  <defs>
    <linearGradient id="bdsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A2540"/>
      <stop offset="0.58" stop-color="#7C3357"/>
      <stop offset="1" stop-color="#A2456F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="100" fill="url(#bdsBg)"/>
  <g opacity="0.14"><circle cx="726" cy="6" r="56" fill="#8CC63F"/></g>

  <g transform="translate(44 50) scale(0.38)" fill="none" stroke="#8CC63F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<rect x="-58" y="-42" width="116" height="80" rx="7"/>
    <path d="M-58-16h116" stroke-width="4" opacity="0.75"/>
    <path d="M-40 8h34M-40 22h56" stroke-width="4" opacity="0.75"/>
    <path d="M34 4l22-22 14 14-22 22-18 4z" fill="#8CC63F" stroke="#8CC63F" stroke-width="4"/>
  </g>

  <text x="76" y="43"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="2.1" fill="#F0C8DC">PEARLAND411 DESIGN</text>
  <text x="76" y="70"
        font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.3" fill="#FFFFFF">No banner? We'll design it</text>

  <g transform="translate(590 30)">
    <rect width="148" height="40" rx="20" fill="#8CC63F"/>
    <text x="74" y="26" text-anchor="middle"
          font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
          font-size="15" font-weight="700" fill="#231018">Design my ad</text>
  </g>
</svg>
