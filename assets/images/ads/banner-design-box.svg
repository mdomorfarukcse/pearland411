<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500"
     role="img" aria-label="Banner and ad design by Pearland411">
  <title>Need a banner designed? Pearland411 designs your ad</title>
  <defs>
    <linearGradient id="bdbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A2540"/>
      <stop offset="0.58" stop-color="#7C3357"/>
      <stop offset="1" stop-color="#A2456F"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="url(#bdbBg)"/>
  <g opacity="0.14"><circle cx="548" cy="56" r="160" fill="#8CC63F"/></g>

  <!-- artboard + pen glyph -->
  <g transform="translate(300 126)" fill="none" stroke="#8CC63F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-58" y="-42" width="116" height="80" rx="7"/>
    <path d="M-58-16h116" stroke-width="4" opacity="0.75"/>
    <path d="M-40 8h34M-40 22h56" stroke-width="4" opacity="0.75"/>
    <path d="M34 4l22-22 14 14-22 22-18 4z" fill="#8CC63F" stroke="#8CC63F" stroke-width="4"/>
  </g>

  <text x="300" y="252" text-anchor="middle"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="16" font-weight="600" letter-spacing="2.8" fill="#F0C8DC">PEARLAND411 DESIGN</text>
  <text x="300" y="300" text-anchor="middle"
        font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="38" font-weight="700" letter-spacing="-0.7" fill="#FFFFFF">No banner?</text>
  <text x="300" y="342" text-anchor="middle"
        font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="38" font-weight="700" letter-spacing="-0.7" fill="#FFFFFF">We'll design it</text>
  <text x="300" y="378" text-anchor="middle"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="19" fill="#EBC6D8">Ad artwork for any size on this page</text>

  <g transform="translate(186 406)">
    <rect width="228" height="58" rx="29" fill="#8CC63F"/>
    <text x="114" y="37" text-anchor="middle"
          font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
          font-size="21" font-weight="700" fill="#231018">Design my ad</text>
  </g>
</svg>
