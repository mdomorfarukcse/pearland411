  <text x="147" y="484" text-anchor="middle" font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Print &amp; web ready</text>

