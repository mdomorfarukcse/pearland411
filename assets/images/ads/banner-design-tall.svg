  <path d="M97 380h100" stroke="#8CC63F" stroke-width="2" opacity="0.5"/>

  <text x="147" y="418" text-anchor="middle" font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="16" fill="#EBC6D8">Ad artwork for</text>
