      <stop offset="0" stop-color="#5A2540"/>
      <stop offset="0.58" stop-color="#7C3357"/>
      <stop offset="1" stop-color="#A2456F"/>
    </linearGradient>
  </defs>

  <rect width="295" height="600" fill="url(#bdtBg)"/>
  <g opacity="0.14"><circle cx="272" cy="66" r="124" fill="#8CC63F"/></g>

  <g transform="translate(147 152) scale(1.05)" fill="none" stroke="#8CC63F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
