<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"
     role="img" aria-label="Advertise your business on Pearland411">
  <title>Your ad could be here — advertise on Pearland411</title>
  <!--
    3:1 on purpose. This one creative is cropped (object-fit: cover) into the
    728x200, 728x250 and 970x250 zones, whose ratios run 2.9–3.9. All content
    therefore sits inside the middle 70% vertically (y 60–240) and away from
    the extreme left/right, so no target crops anything meaningful.
    Ratios wider than 6:1 use -strip instead.
  -->
  <defs>
    <linearGradient id="hwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E8A28"/>
      <stop offset="0.55" stop-color="#6BA935"/>
      <stop offset="1" stop-color="#8CC63F"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="url(#hwBg)"/>
  <g opacity="0.10" fill="#FFFFFF">
    <circle cx="812" cy="34" r="150"/>
    <circle cx="70" cy="286" r="110"/>
  </g>

  <g transform="translate(122 150) scale(1.05)" opacity="0.95">
    <path d="M0-40c-11 0-20 10-20 24 0 9-9 15-14 25-8 17 6 38 34 38s42-21 34-38c-5-10-14-16-14-25 0-14-9-24-20-24z" fill="#FFFFFF"/>
    <path d="M1-40c0-10 2-18 6-25" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M9-61c7-14 22-21 36-19 1 15-9 26-26 28-6 1-10-4-10-9z" fill="#DCEFC0"/>
  </g>

  <text x="192" y="120"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="15" font-weight="600" letter-spacing="2.8" fill="#DCEFC0">AD SPACE AVAILABLE</text>
  <text x="192" y="164"
        font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="35" font-weight="700" letter-spacing="-0.6" fill="#FFFFFF">Your ad belongs here</text>
  <text x="192" y="196"
        font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="17" fill="#EAF5D8">Reach Pearland customers &#8212; from $29 / month.</text>

  <g transform="translate(192 214)">
    <rect width="176" height="48" rx="24" fill="#FFFFFF"/>
    <text x="88" y="31" text-anchor="middle"
          font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
          font-size="18" font-weight="700" fill="#4E8A28">Advertise here</text>
  </g>
</svg>
