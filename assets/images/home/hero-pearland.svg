<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720"
     preserveAspectRatio="xMidYMax slice" role="img"
     aria-label="Illustration of Pearland at dusk — the water tower, Town Center storefronts and people out on the plaza">
  <title>Pearland at dusk</title>
  <desc>
    Hero backdrop for the homepage. Hand-authored rather than generated (the
    other artwork comes out of scripts/generate_brand_art.py) because it is one
    bespoke scene, not a family of variants.

    Read from the top: navy sky, a warm burgundy dusk on the horizon, the
    Pearland water tower and a Town Center-style storefront row, then people on
    the plaza in the foreground. The brief asked for imagery that "shows people
    and businesses, not only buildings", and for the hero to run navy at the top
    into a muted burgundy rather than the old green gradient.

    Everything sits in the lower two-thirds: the headline and the search bar
    cover the top of the box, and the view crops from the top on narrow screens
    (preserveAspectRatio="xMidYMax slice"), so nothing meaningful lives up there.
  </desc>

  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#171A45"/>
      <stop offset="0.34" stop-color="#20245B"/>
      <stop offset="0.58" stop-color="#3E2450"/>
      <stop offset="0.72" stop-color="#6D263D"/>
      <stop offset="1"    stop-color="#4A1C2E"/>
    </linearGradient>

    <radialGradient id="hGlow" cx="0.6" cy="0.66" r="0.55">
      <stop offset="0"    stop-color="#D8845C" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8A3D59" stop-opacity="0.32"/>
      <stop offset="1"    stop-color="#6D263D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2350" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#231D45" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="hGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191537"/>
      <stop offset="1" stop-color="#12102A"/>
    </linearGradient>

    <!-- Warm light spilling out of the shop windows onto the plaza. -->
    <linearGradient id="hSpill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C08A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F0C08A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ SKY == -->
  <rect width="1600" height="720" fill="url(#hSky)"/>
  <ellipse cx="960" cy="474" rx="880" ry="330" fill="url(#hGlow)"/>

  <!-- a few stars, only high up where the sky stays dark -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="180" cy="70" r="1.8"/><circle cx="360" cy="132" r="1.4"/>
    <circle cx="520" cy="58" r="1.6"/><circle cx="742" cy="112" r="1.3"/>
    <circle cx="1020" cy="64" r="1.7"/><circle cx="1216" cy="126" r="1.4"/>
    <circle cx="1402" cy="80" r="1.6"/><circle cx="1516" cy="150" r="1.3"/>
    <circle cx="92" cy="176" r="1.3"/><circle cx="880" cy="42" r="1.4"/>
  </g>

  <!-- thin cloud bands, catching the dusk -->
  <g fill="#8A3D59" opacity="0.22">
    <ellipse cx="300" cy="352" rx="250" ry="16"/>
    <ellipse cx="1180" cy="322" rx="300" ry="14"/>
    <ellipse cx="820" cy="392" rx="200" ry="11"/>
  </g>

  <!-- ============================================== DISTANT SKYLINE == -->
  <g fill="url(#hFar)">
    <path d="M0 470h96v-84h54v84h72v-118h60v118h84v-62h48v62h70v-96h58v96H0z"/>
    <path d="M1140 470v-104h62v104h74v-72h50v72h86v-132h58v132h62v-58h68v58V470z"/>
    <!-- a low civic block with a pitched roof, centre-left -->
    <path d="M470 470v-72h34l30-30 30 30h34v72z"/>
  </g>

  <!-- ================================================= WATER TOWER == -->
  <!-- Pearland's landmark, and the one thing that makes the skyline read
       as this town rather than any town. -->
  <g transform="translate(258 158)">
    <g fill="#2E2757" stroke="#3A3269" stroke-width="2">
      <!-- legs -->
      <path d="M-34 118 -46 312M34 118 46 312M-34 118 46 312M34 118 -46 312" fill="none"/>
      <path d="M-40 214h80M-44 262h88" fill="none"/>
      <!-- tank -->
      <path d="M-62 60c0-34 28-58 62-58s62 24 62 58v26c0 26-28 44-62 44S-62 112-62 86z"/>
      <!-- cap + finial -->
      <path d="M-30 6c8-14 20-22 30-22s22 8 30 22z"/>
      <path d="M0-16v-16" stroke-linecap="round"/>
    </g>
    <text x="0" y="82" text-anchor="middle"
          font-family="'Poppins','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
          font-size="25" font-weight="700" letter-spacing="2" fill="#79B82A" opacity="0.9">PEARLAND</text>
    <!-- aircraft warning light -->
    <circle cx="0" cy="-34" r="4" fill="#C4694F" opacity="0.9"/>
  </g>

  <!-- ================================================= TREE LINE == -->
  <g fill="#1D1A40" opacity="0.9">
    <g transform="translate(120 470)">
      <path d="M0 0v-46" stroke="#1D1A40" stroke-width="7"/>
      <ellipse cx="0" cy="-62" rx="40" ry="34"/><ellipse cx="-24" cy="-44" rx="26" ry="22"/>
      <ellipse cx="26" cy="-46" rx="26" ry="22"/>
    </g>
    <g transform="translate(1466 470)">
      <path d="M0 0v-52" stroke="#1D1A40" stroke-width="8"/>
      <ellipse cx="0" cy="-70" rx="46" ry="38"/><ellipse cx="-30" cy="-48" rx="28" ry="24"/>
      <ellipse cx="30" cy="-50" rx="28" ry="24"/>
    </g>
    <g transform="translate(690 470)">
      <path d="M0 0v-38" stroke="#1D1A40" stroke-width="6"/>
      <ellipse cx="0" cy="-52" rx="32" ry="28"/>
    </g>
  </g>

  <!-- ========================================== STOREFRONT ROW == -->
  <!-- A Town Center-style parade of local businesses: awnings, lit windows,
       a restaurant, a shop, a clinic. -->
  <g>
    <!-- terrace body -->
    <path d="M330 470V318h190v152zM520 470V296h230v174zM750 470V330h170v140zM920 470V286h215v184zM1135 470V336h180v134z"
          fill="#241F4A"/>
    <!-- roof line + parapets -->
    <g fill="#2C2657">
      <rect x="322" y="310" width="206" height="14" rx="4"/>
      <rect x="512" y="288" width="246" height="14" rx="4"/>
      <rect x="742" y="322" width="186" height="14" rx="4"/>
      <rect x="912" y="278" width="231" height="14" rx="4"/>
      <rect x="1127" y="328" width="196" height="14" rx="4"/>
    </g>

    <!-- lit upper windows -->
    <g fill="#F2C48E" opacity="0.75">
      <rect x="352" y="342" width="26" height="34" rx="3"/>
      <rect x="398" y="342" width="26" height="34" rx="3" opacity="0.45"/>
      <rect x="444" y="342" width="26" height="34" rx="3"/>
      <rect x="548" y="320" width="28" height="36" rx="3"/>
      <rect x="598" y="320" width="28" height="36" rx="3" opacity="0.5"/>
      <rect x="648" y="320" width="28" height="36" rx="3"/>
      <rect x="698" y="320" width="28" height="36" rx="3" opacity="0.4"/>
      <rect x="778" y="352" width="26" height="32" rx="3" opacity="0.6"/>
      <rect x="824" y="352" width="26" height="32" rx="3"/>
      <rect x="870" y="352" width="26" height="32" rx="3" opacity="0.45"/>
      <rect x="946" y="308" width="28" height="36" rx="3"/>
      <rect x="996" y="308" width="28" height="36" rx="3" opacity="0.5"/>
      <rect x="1046" y="308" width="28" height="36" rx="3"/>
      <rect x="1096" y="308" width="28" height="36" rx="3" opacity="0.35"/>
      <rect x="1162" y="358" width="26" height="32" rx="3" opacity="0.55"/>
      <rect x="1208" y="358" width="26" height="32" rx="3"/>
      <rect x="1254" y="358" width="26" height="32" rx="3" opacity="0.5"/>
    </g>

    <!-- awnings, in the three brand colours -->
    <g>
      <path d="M336 404h178l-14 30H350z" fill="#6D263D"/>
      <path d="M528 388h214l-16 32H544z" fill="#79B82A" opacity="0.85"/>
      <path d="M758 412h154l-14 28H772z" fill="#8A3D59"/>
      <path d="M928 380h199l-16 32H944z" fill="#2C3178"/>
      <path d="M1143 416h164l-14 28H1157z" fill="#79B82A" opacity="0.7"/>
    </g>

    <!-- shopfront glass, warmly lit -->
    <g fill="#F2C48E" opacity="0.55">
      <rect x="352" y="440" width="146" height="30" rx="3"/>
      <rect x="548" y="426" width="180" height="44" rx="3"/>
      <rect x="778" y="446" width="118" height="24" rx="3"/>
      <rect x="948" y="418" width="164" height="52" rx="3"/>
      <rect x="1162" y="450" width="130" height="20" rx="3"/>
    </g>
    <!-- doorways -->
    <g fill="#12102A" opacity="0.7">
      <rect x="410" y="444" width="30" height="26" rx="2"/>
      <rect x="620" y="432" width="34" height="38" rx="2"/>
      <rect x="1010" y="424" width="36" height="46" rx="2"/>
    </g>
    <!-- light spilling onto the pavement -->
    <path d="M336 470h1000v-8H336z" fill="url(#hSpill)"/>
  </g>

  <!-- ================================================ STRING LIGHTS == -->
  <g stroke="#F2C48E" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M300 402q170 46 340 0t340 0 340-6"/>
  </g>
  <g fill="#F2C48E" opacity="0.85">
    <circle cx="368" cy="418" r="3"/><circle cx="452" cy="428" r="3"/>
    <circle cx="536" cy="428" r="3"/><circle cx="620" cy="418" r="3"/>
    <circle cx="706" cy="404" r="3"/><circle cx="792" cy="416" r="3"/>
    <circle cx="878" cy="426" r="3"/><circle cx="962" cy="426" r="3"/>
    <circle cx="1046" cy="416" r="3"/><circle cx="1132" cy="404" r="3"/>
    <circle cx="1216" cy="404" r="3"/><circle cx="1300" cy="400" r="3"/>
  </g>

  <!-- ===================================================== PLAZA == -->
  <rect x="0" y="470" width="1600" height="250" fill="url(#hGround)"/>
  <g stroke="#241F4A" stroke-width="2" opacity="0.6">
    <path d="M0 512h1600M0 566h1600M0 634h1600"/>
  </g>

  <!-- lamp posts -->
  <g stroke="#2A2551" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M212 470v-92M1388 470v-92"/>
  </g>
  <g fill="#F2C48E" opacity="0.8">
    <circle cx="212" cy="372" r="9"/><circle cx="1388" cy="372" r="9"/>
  </g>
  <g fill="#F2C48E" opacity="0.10">
    <path d="M212 372 156 470h112zM1388 372l-56 98h112z"/>
  </g>

  <!-- street furniture, between the shopfronts and the figures -->
  <g fill="#1B1739">
    <g transform="translate(330 542)">
      <rect x="-46" y="-14" width="92" height="9" rx="4"/>
      <rect x="-40" y="-5" width="7" height="20" rx="3"/><rect x="33" y="-5" width="7" height="20" rx="3"/>
      <rect x="-46" y="-30" width="92" height="7" rx="3" opacity="0.85"/>
    </g>
    <g transform="translate(1200 548)">
      <rect x="-46" y="-14" width="92" height="9" rx="4"/>
      <rect x="-40" y="-5" width="7" height="20" rx="3"/><rect x="33" y="-5" width="7" height="20" rx="3"/>
      <rect x="-46" y="-30" width="92" height="7" rx="3" opacity="0.85"/>
    </g>
    <!-- planters -->
    <g transform="translate(700 556)">
      <path d="M-26 0h52l-6 22h-40z"/>
      <ellipse cx="0" cy="-16" rx="26" ry="17" opacity="0.9"/>
    </g>
    <g transform="translate(1440 566)">
      <path d="M-26 0h52l-6 22h-40z"/>
      <ellipse cx="0" cy="-16" rx="26" ry="17" opacity="0.9"/>
    </g>
  </g>

  <!-- ================================================== PEOPLE == -->
  <!-- Not scenery: the brief asked for people, so the foreground is a
       family, a couple with shopping, and someone with a dog. They stand on
       the near edge of the plaza, well below the shop parapets — at the
       storefront line a figure would be as tall as the buildings. -->
  <g fill="#0E0C22">
    <!-- family of three, left of centre -->
    <g transform="translate(492 610) scale(0.92)">
      <circle cx="0" cy="-96" r="15"/>
      <path d="M-16-78h32l6 46-9 2-3 30h-8l-4-30h-8l-4 30h-8l-3-30-9-2z"/>
      <circle cx="42" cy="-90" r="14"/>
      <path d="M28-74h28l6 42-8 2-3 30h-8l-3-30h-6l-3 30h-8l-3-30-8-2z"/>
      <!-- child, holding a hand -->
      <circle cx="74" cy="-56" r="10"/>
      <path d="M64-46h20l4 26-5 1-2 19h-6l-2-19h-4l-2 19h-6l-2-19-5-1z"/>
      <path d="M56-62q10 4 12 12" stroke="#0E0C22" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- couple with shopping bags, right of centre -->
    <g transform="translate(1046 618) scale(0.96)">
      <circle cx="0" cy="-98" r="15"/>
      <path d="M-16-80h32l7 44-9 2-3 34h-9l-3-34h-6l-3 34h-9l-3-34-9-2z"/>
      <rect x="20" y="-52" width="20" height="24" rx="2" opacity="0.9"/>
      <path d="M22-52q8-8 16 0" stroke="#0E0C22" stroke-width="3" fill="none"/>
      <circle cx="-44" cy="-94" r="14"/>
      <path d="M-59-77h30l6 42-8 2-3 32h-8l-3-32h-6l-3 32h-8l-3-32-8-2z"/>
      <rect x="-84" y="-50" width="18" height="22" rx="2" opacity="0.9"/>
    </g>

    <!-- someone walking a dog, far right -->
    <g transform="translate(1330 594) scale(0.84)">
      <circle cx="0" cy="-92" r="14"/>
      <path d="M-15-75h30l6 42-8 2-3 31h-8l-3-31h-6l-3 31h-8l-3-31-8-2z"/>
      <path d="M14-58q26 8 34 30" stroke="#0E0C22" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g transform="translate(56 -2)">
        <ellipse cx="0" cy="-16" rx="17" ry="9"/>
        <circle cx="16" cy="-24" r="7"/>
        <path d="M-14-8v8M-4-8v8M6-8v8M14-8v8" stroke="#0E0C22" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M-16-20q-8-6-4-12" stroke="#0E0C22" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- further-off figures on the pavement: smaller, softer, higher up the
         plaza, which is what puts distance between them and the group above -->
    <g opacity="0.5" transform="translate(830 512) scale(0.42)">
      <circle cx="0" cy="-92" r="14"/>
      <path d="M-15-75h30l6 42-8 2-3 31h-8l-3-31h-6l-3 31h-8l-3-31-8-2z"/>
      <circle cx="38" cy="-88" r="13"/>
      <path d="M24-72h28l6 40-8 2-3 30h-8l-3-30h-5l-3 30h-8l-3-30-8-2z"/>
    </g>
    <g opacity="0.4" transform="translate(432 506) scale(0.36)">
      <circle cx="0" cy="-90" r="14"/>
      <path d="M-15-73h30l6 41-8 2-3 30h-8l-3-30h-6l-3 30h-8l-3-30-8-2z"/>
    </g>
    <g opacity="0.42" transform="translate(1118 508) scale(0.38)">
      <circle cx="0" cy="-90" r="14"/>
      <path d="M-15-73h30l6 41-8 2-3 30h-8l-3-30h-6l-3 30h-8l-3-30-8-2z"/>
    </g>
  </g>

  <!-- bottom fade, so type never has to fight the illustration -->
  <rect x="0" y="600" width="1600" height="120" fill="#12102A" opacity="0.55"/>
</svg>
