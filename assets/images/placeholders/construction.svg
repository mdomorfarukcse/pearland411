<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480"
     role="img" aria-label="Home Improvement — photo coming soon">
  <title>Home Improvement — photo coming soon</title>
  <!--
    Category placeholder. Cream/grey ground, one line glyph, a single green
    accent bar bottom-left. Deliberately quiet: it sits in a grid next to real
    photographs and must not compete with them.
    Generated by scripts/generate_brand_art.py — edit there, not here.
  -->
  <defs>
    <linearGradient id="bgconstruction" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#F2F3F5"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#bgconstruction)"/>

  <!-- barely-there diagonal weave, so the tile reads as designed, not broken -->
  <g stroke="#20245B" stroke-width="1" opacity="0.05">
    <path d="M-80 400 400 -80M0 480 480 0M80 560 560 80M160 640 640 160M240 720 720 240"/>
  </g>

  <g transform="translate(320 232)">
    <circle r="108" fill="#FFFFFF" opacity="0.9"/>
    <circle r="108" fill="none" stroke="#20245B" stroke-width="2" opacity="0.12"/>
    <g transform="translate(-69 -69) scale(5.75)" fill="none" stroke="#20245B" stroke-width="1.3"
       stroke-linecap="round" stroke-linejoin="round" opacity="0.72"><path d="M4 20.5h16"/><path d="M6.5 20.5v-6h11v6"/><path d="M4.5 14.5 12 8l7.5 6.5"/><path d="M14 3.5h4v4"/></g>
  </g>

  <!-- No category wording: the card that shows this already carries the
       listing's own category badge, and two different labels on one tile
       read as a mistake. The glyph carries the category. -->
  <text x="320" y="388" text-anchor="middle" font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="19" fill="#5A6472">Photo coming soon</text>

  <!-- the small green accent the brief asks for, and nothing more -->
  <rect x="40" y="424" width="64" height="6" rx="3" fill="#79B82A"/>
  <text x="600" y="431" text-anchor="end" font-family="'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="15" font-weight="600" fill="#20245B" opacity="0.4">Pearland411</text>
</svg>
